<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>세계 4대 종교 전파 시뮬레이션</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    body { background: #060913; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow-x: hidden; }

    /* 대기실 */
    #lobby-view { width: 92%; max-width: 500px; background: #0c1220; border: 1px solid #1e293b; border-radius: 16px; padding: 26px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.8); }
    .lobby-title { font-size: 24px; font-weight: 800; color: #38bdf8; margin-bottom: 8px; }
    .lobby-desc { font-size: 13.5px; color: #94a3b8; margin-bottom: 20px; line-height: 1.5; }
    .input-row { display: flex; gap: 8px; margin-bottom: 15px; }
    input { flex: 1; padding: 12px 14px; border-radius: 8px; border: 1px solid #334155; background: #060913; color: white; font-size: 15px; outline: none; }
    button { cursor: pointer; border: none; font-weight: bold; border-radius: 8px; transition: 0.2s; }
    .btn-join { background: #38bdf8; color: #060913; padding: 12px 20px; font-size: 15px; }
    .btn-start { width: 100%; background: #10b981; color: white; padding: 14px; font-size: 16px; margin-top: 15px; }

    .player-list { list-style: none; margin: 15px 0; background: #060913; border-radius: 10px; padding: 10px; text-align: left; }
    .player-item { padding: 9px 12px; border-radius: 6px; background: #1e293b; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
    .tag-host { background: #f59e0b; color: #060913; font-size: 11px; padding: 2px 6px; border-radius: 4px; font-weight: bold; }

    /* 인게임 루미큐브 테이블 레이아웃 */
    #game-view { display: none; width: 100vw; height: 100vh; max-width: 1480px; grid-template-rows: 95px 1fr 105px; grid-template-columns: 260px 1fr 260px; gap: 12px; padding: 12px; box-sizing: border-box; }

    @media (max-width: 1024px) {
      #game-view { display: none; height: auto; grid-template-rows: auto; grid-template-columns: 1fr; }
    }

    /* 종교 패널 (상하좌우 4방향) */
    .religion-card { background: #0b1120; border: 2px solid #1e293b; border-radius: 14px; padding: 12px 16px; display: flex; flex-direction: column; justify-content: space-between; transition: 0.3s; position: relative; }
    .religion-card.active-turn { border-color: #facc15 !important; box-shadow: 0 0 25px rgba(250, 204, 21, 0.5) !important; transform: scale(1.02); }
    .card-top { display: flex; justify-content: space-between; align-items: center; }
    .religion-name { font-size: 17px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
    .religion-score { font-size: 26px; font-weight: 900; }
    .region-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
    .region-tag { font-size: 11px; padding: 3px 7px; border-radius: 4px; background: #1e293b; color: #cbd5e1; }

    .panel-north { grid-column: 2; grid-row: 1; border-top: 5px solid #8b5cf6; background: linear-gradient(180deg, rgba(139,92,246,0.18) 0%, #0b1120 100%); }
    .panel-west  { grid-column: 1; grid-row: 2; border-left: 5px solid #10b981; background: linear-gradient(90deg, rgba(16,185,129,0.18) 0%, #0b1120 100%); }
    .panel-east  { grid-column: 3; grid-row: 2; border-right: 5px solid #f59e0b; background: linear-gradient(270deg, rgba(245,158,11,0.18) 0%, #0b1120 100%); }
    .panel-south { grid-column: 2; grid-row: 3; border-bottom: 5px solid #ea580c; background: linear-gradient(0deg, rgba(234,88,12,0.18) 0%, #0b1120 100%); }

    /* 중앙 세계 지도 보드 */
    .board-center { grid-column: 2; grid-row: 2; background: #070c18; border-radius: 16px; border: 1px solid #1e293b; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; padding: 6px; }
    .map-svg { width: 100%; height: 100%; max-height: 520px; }

    /* 교과서 지도 대륙 형태 벡터 */
    .landmass { fill: #111a2e; stroke: #223252; stroke-width: 1.2; }
    .trade-arrow { stroke: #2563eb; stroke-width: 1.6; stroke-dasharray: 4; fill: none; opacity: 0.7; }

    /* 국가 노드 */
    .nation-node { cursor: pointer; transition: 0.2s; }
    .nation-node:hover rect { stroke: #ffffff; stroke-width: 2.5; }
    .nation-node.selected rect { stroke: #facc15; stroke-width: 3.5; filter: drop-shadow(0 0 10px #facc15); }

    /* 하단 조작 바 */
    .action-panel { position: absolute; bottom: 12px; background: rgba(11, 17, 32, 0.95); backdrop-filter: blur(8px); border: 1px solid #38bdf8; border-radius: 12px; padding: 9px 18px; display: flex; gap: 10px; align-items: center; z-index: 10; box-shadow: 0 8px 24px rgba(0,0,0,0.6); }
    .method-btn { background: #1e293b; color: white; padding: 8px 14px; border-radius: 8px; font-size: 13px; border: 1px solid #475569; }
    .method-btn.selected { background: #38bdf8; color: #060913; font-weight: bold; border-color: #38bdf8; }
    .btn-spread { background: #e11d48; color: white; padding: 9px 20px; font-size: 14px; border-radius: 8px; font-weight: 800; }
    .btn-spread:disabled { opacity: 0.35; cursor: not-allowed; }

    /* 결과 모달 (절대 깨지지 않는 내장 벡터 아트 캔버스) */
    #result-modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.82); backdrop-filter: blur(8px); z-index: 999; align-items: center; justify-content: center; }
    .modal-card { width: 92%; max-width: 540px; background: #0c1220; border: 2px solid #38bdf8; border-radius: 18px; overflow: hidden; box-shadow: 0 25px 60px rgba(0,0,0,0.95); animation: popUp 0.3s ease-out; }
    
    .modal-art-box { width: 100%; height: 210px; background: linear-gradient(135deg, #090e1a 0%, #1e293b 100%); display: flex; align-items: center; justify-content: center; position: relative; border-bottom: 2px solid #1e293b; }
    .art-svg { width: 100%; height: 100%; }

    .modal-content { padding: 18px 22px; text-align: left; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .modal-badge { padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; }
    .modal-title { font-size: 20px; font-weight: 800; color: #ffffff; }
    .modal-desc { font-size: 13px; color: #94a3b8; line-height: 1.5; margin: 6px 0 12px 0; }
    
    .modal-event-box { background: #162032; border-radius: 10px; padding: 12px 14px; margin-bottom: 15px; border-left: 4px solid #facc15; }
    .event-score-tag { font-size: 20px; font-weight: 900; float: right; }
    .btn-close-modal { width: 100%; background: #38bdf8; color: #060913; padding: 12px; font-size: 15px; font-weight: 800; border-radius: 8px; }

    @keyframes popUp {
      from { transform: scale(0.85); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- 대기실 -->
  <div id="lobby-view">
    <div class="lobby-title">🌍 세계 종교 전파 시뮬레이션</div>
    <div class="lobby-desc">
      교과서 속 4대 종교의 실제 발상지와 대표 국가, 그리고 전파 경로를 탐험합니다.<br>
      <span style="color:#38bdf8;">(혼자 테스트 시 '솔로 테스트 시작'으로 4개 종교를 모두 조작해볼 수 있습니다)</span>
    </div>

    <div id="join-form" class="input-row">
      <input id="playerName" placeholder="학생 이름 입력" maxlength="8" />
      <button class="btn-join" onclick="joinGame()">입장</button>
    </div>
    <div id="joined-msg" style="display:none; color:#10b981; font-weight:bold; margin-bottom:12px;">
      ✅ 입장 완료!
    </div>

    <ul id="playerList" class="player-list"></ul>
    <button id="startBtn" class="btn-start" onclick="startGame()" style="display:none;">게임 시작</button>
  </div>

  <!-- 인게임 화면 -->
  <div id="game-view">
    
    <!-- 북쪽: 크리스트교 -->
    <div id="card-christianity" class="religion-card panel-north">
      <div class="card-top">
        <div class="religion-name" style="color:#c4b5fd;">✝️ 크리스트교 <span id="turn-tag-christianity" style="display:none; font-size:11px; background:#facc15; color:black; padding:1px 6px; border-radius:3px;">내 턴</span></div>
        <div id="score-christianity" class="religion-score">60점</div>
      </div>
      <div id="regions-christianity" class="region-tags"><span class="region-tag">바티칸·이탈리아</span></div>
    </div>

    <!-- 서쪽: 이슬람교 -->
    <div id="card-islam" class="religion-card panel-west">
      <div class="card-top">
        <div class="religion-name" style="color:#6ee7b7;">☪️ 이슬람교 <span id="turn-tag-islam" style="display:none; font-size:11px; background:#facc15; color:black; padding:1px 6px; border-radius:3px;">내 턴</span></div>
        <div id="score-islam" class="religion-score">60점</div>
      </div>
      <div id="regions-islam" class="region-tags"><span class="region-tag">사우디아라비아</span></div>
    </div>

    <!-- 중앙: 교과서 세계 지도 SVG -->
    <div class="board-center">
      <svg class="map-svg" viewBox="0 0 1000 550">
        <rect width="1000" height="550" fill="#070c18" rx="14"/>

        <!-- 교과서 지도 실제 대륙 해안선 벡터 -->
        <g opacity="0.65">
          <!-- 북아메리카 -->
          <path class="landmass" d="M 80 80 Q 150 40 240 70 Q 280 120 250 170 Q 210 200 170 240 L 130 180 Z" />
          <!-- 라틴아메리카 -->
          <path class="landmass" d="M 190 250 Q 280 250 320 330 Q 300 450 240 480 Q 210 390 190 300 Z" />
          <!-- 유럽 -->
          <path class="landmass" d="M 430 80 Q 510 60 540 120 Q 480 170 420 150 Z" />
          <!-- 아프리카 (북부 + 사하라 이남) -->
          <path class="landmass" d="M 430 180 Q 560 170 580 280 Q 540 420 480 430 Q 420 320 420 220 Z" />
          <!-- 서남아시아 -->
          <path class="landmass" d="M 570 170 Q 640 170 650 250 Q 580 270 560 210 Z" />
          <!-- 아시아 본토 (동아시아, 남아시아) -->
          <path class="landmass" d="M 550 70 Q 820 60 880 160 Q 820 260 740 240 Q 670 300 620 200 Z" />
          <!-- 동남아시아 도서 군도 -->
          <path class="landmass" d="M 720 270 Q 840 260 860 350 Q 770 380 720 310 Z" />
          <!-- 오세아니아 (호주) -->
          <path class="landmass" d="M 800 390 Q 920 380 940 460 Q 840 490 800 430 Z" />
        </g>

        <!-- 교과서 속 해양 및 육상 전파 화살표선 -->
        <g class="trade-arrow">
          <path d="M 220 130 Q 340 100 450 120"/> <!-- 대서양 횡단 -->
          <path d="M 460 140 Q 380 280 260 330"/> <!-- 유럽-라틴미 -->
          <path d="M 470 140 Q 530 160 590 200"/> <!-- 유럽-서남아 -->
          <path d="M 600 220 Q 640 250 670 290"/> <!-- 서남아-인도 -->
          <path d="M 670 290 Q 720 290 770 270"/> <!-- 인도-태국 -->
          <path d="M 670 290 Q 740 330 780 370"/> <!-- 인도-인니 해상로 -->
          <path d="M 770 260 Q 800 200 840 150"/> <!-- 동남아-한국 실크로드 -->
          <path d="M 460 220 Q 480 300 500 370"/> <!-- 북부-서아프리카 -->
        </g>

        <!-- 11개 교과서 핵심 국가 노드 -->
        <!-- 1. 미국 -->
        <g class="nation-node" onclick="clickRegion('미국')">
          <rect id="node-미국" x="140" y="110" width="110" height="46" rx="8" fill="#111a2e" stroke="#334155" stroke-width="2"/>
          <text x="195" y="139" fill="white" font-size="13" font-weight="bold" text-anchor="middle">🇺🇸 미국</text>
        </g>

        <!-- 2. 브라질 -->
        <g class="nation-node" onclick="clickRegion('브라질')">
          <rect id="node-브라질" x="210" y="325" width="110" height="46" rx="8" fill="#111a2e" stroke="#334155" stroke-width="2"/>
          <text x="265" y="354" fill="white" font-size="13" font-weight="bold" text-anchor="middle">🇧🇷 브라질</text>
        </g>

        <!-- 3. 바티칸·이탈리아 (크리스트교 기점) -->
        <g class="nation-node" onclick="clickRegion('바티칸·이탈리아')">
          <rect id="node-바티칸·이탈리아" x="415" y="100" width="125" height="46" rx="8" fill="#8b5cf6" stroke="#c4b5fd" stroke-width="2"/>
          <text x="477" y="129" fill="white" font-size="12" font-weight="bold" text-anchor="middle">🇮🇹 바티칸·이탈리아</text>
        </g>

        <!-- 4. 이집트 -->
        <g class="nation-node" onclick="clickRegion('이집트')">
          <rect id="node-이집트" x="430" y="195" width="105" height="46" rx="8" fill="#111a2e" stroke="#334155" stroke-width="2"/>
          <text x="482" y="224" fill="white" font-size="12" font-weight="bold" text-anchor="middle">🇪🇬 이집트</text>
        </g>

        <!-- 5. 나이지리아 (아프리카 종합존) -->
        <g class="nation-node" onclick="clickRegion('나이지리아')">
          <rect id="node-나이지리아" x="435" y="285" width="120" height="46" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="2"/>
          <text x="495" y="314" fill="white" font-size="12" font-weight="bold" text-anchor="middle">🇳🇬 나이지리아(종합)</text>
        </g>

        <!-- 6. 사우디아라비아 (이슬람교 성지) -->
        <g class="nation-node" onclick="clickRegion('사우디아라비아')">
          <rect id="node-사우디아라비아" x="555" y="190" width="120" height="46" rx="8" fill="#10b981" stroke="#6ee7b7" stroke-width="2"/>
          <text x="615" y="219" fill="white" font-size="12" font-weight="bold" text-anchor="middle">🇸🇦 사우디아라비아</text>
        </g>

        <!-- 7. 인도 (힌두교 기점) -->
        <g class="nation-node" onclick="clickRegion('인도')">
          <rect id="node-인도" x="625" y="275" width="100" height="46" rx="8" fill="#ea580c" stroke="#fdba74" stroke-width="2"/>
          <text x="675" y="304" fill="white" font-size="13" font-weight="bold" text-anchor="middle">🇮🇳 인도</text>
        </g>

        <!-- 8. 태국 (불교 중심국) -->
        <g class="nation-node" onclick="clickRegion('태국')">
          <rect id="node-태국" x="720" y="240" width="105" height="46" rx="8" fill="#f59e0b" stroke="#fde68a" stroke-width="2"/>
          <text x="772" y="269" fill="white" font-size="13" font-weight="bold" text-anchor="middle">🇹🇭 태국</text>
        </g>

        <!-- 9. 인도네시아 (세계 최대 무슬림 + 다종교 종합존) -->
        <g class="nation-node" onclick="clickRegion('인도네시아')">
          <rect id="node-인도네시아" x="730" y="340" width="125" height="46" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="2"/>
          <text x="792" y="369" fill="white" font-size="12" font-weight="bold" text-anchor="middle">🇮🇩 인도네시아(종합)</text>
        </g>

        <!-- 10. 싱가포르 (동남아 다종교 화합존) -->
        <g class="nation-node" onclick="clickRegion('싱가포르')">
          <rect id="node-싱가포르" x="795" y="295" width="115" height="44" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="2"/>
          <text x="852" y="323" fill="white" font-size="11.5" font-weight="bold" text-anchor="middle">🇸🇬 싱가포르(종합)</text>
        </g>

        <!-- 11. 한국 (동아시아 다종교 종합존) -->
        <g class="nation-node" onclick="clickRegion('한국')">
          <rect id="node-한국" x="800" y="125" width="110" height="46" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="2"/>
          <text x="855" y="154" fill="white" font-size="13" font-weight="bold" text-anchor="middle">🇰🇷 한국(종합)</text>
        </g>
      </svg>

      <!-- 조작 컨트롤 바 -->
      <div class="action-panel">
        <span id="targetLabel" style="font-size:13px; color:#cbd5e1; font-weight:600;">국가를 선택하세요</span>
        <button class="method-btn selected" id="btn-direct" onclick="setMethod('직접전파')">인접로 직접전파</button>
        <button class="method-btn" id="btn-long" onclick="setMethod('장거리')">교역·해상 장거리전파</button>
        <button id="execBtn" class="btn-spread" onclick="sendAction()" disabled>전파 실행</button>
      </div>
    </div>

    <!-- 동쪽: 불교 -->
    <div id="card-buddhism" class="religion-card panel-east">
      <div class="card-top">
        <div class="religion-name" style="color:#fde68a;">☸️ 불교 <span id="turn-tag-buddhism" style="display:none; font-size:11px; background:#facc15; color:black; padding:1px 6px; border-radius:3px;">내 턴</span></div>
        <div id="score-buddhism" class="religion-score">60점</div>
      </div>
      <div id="regions-buddhism" class="region-tags"><span class="region-tag">태국</span></div>
    </div>

    <!-- 남쪽: 힌두교 -->
    <div id="card-hinduism" class="religion-card panel-south">
      <div class="card-top">
        <div class="religion-name" style="color:#fdba74;">🕉️ 힌두교 <span id="turn-tag-hinduism" style="display:none; font-size:11px; background:#facc15; color:black; padding:1px 6px; border-radius:3px;">내 턴</span></div>
        <div id="score-hinduism" class="religion-score">60점</div>
      </div>
      <div id="regions-hinduism" class="region-tags"><span class="region-tag">인도</span></div>
    </div>

  </div>

  <!-- 결과 모달 카드 (내장 벡터 아트 + 교과서 사건) -->
  <div id="result-modal">
    <div class="modal-card">
      <div class="modal-art-box" id="modalArtBox">
        <!-- 자체 렌더링 벡터 아트가 여기에 들어갑니다 -->
      </div>
      <div class="modal-content">
        <div class="modal-header">
          <div id="modalRegionBadge" class="modal-badge"></div>
          <div id="modalMethodBadge" style="font-size:12px; color:#94a3b8;"></div>
        </div>
        <div id="modalTitle" class="modal-title"></div>
        <div id="modalDesc" class="modal-desc"></div>

        <div class="modal-event-box">
          <div id="modalEventScore" class="event-score-tag"></div>
          <div style="font-size:11.5px; color:#facc15; font-weight:bold; margin-bottom:4px;">⚡ 발생 사건 및 현지 반응</div>
          <div id="modalEventText" style="font-size:14px; color:#ffffff; font-weight:600;"></div>
        </div>

        <button class="btn-close-modal" onclick="closeModal()">확인 및 다음 턴 진행</button>
      </div>
    </div>
  </div>

  <script>
    const socket = io();
    let myId = null;
    let selectedRegionKey = null;
    let selectedMethod = '직접전파';
    let currentActiveReligion = '크리스트교';
    let myAssignedReligion = null;
    let isSolo = false;

    // Web Audio 신시사이저 (종교별 고유 사운드)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playTone(freq, type, duration, delay = 0) {
      setTimeout(() => {
        try {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + duration);
        } catch(e) {}
      }, delay);
    }

    function playReligionSound(religion) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      if (religion === '크리스트교') {
        playTone(523.25, 'sine', 1.2, 0);   // C5
        playTone(659.25, 'sine', 1.2, 100); // E5
        playTone(783.99, 'sine', 1.5, 200); // G5
      } else if (religion === '이슬람교') {
        playTone(440, 'triangle', 0.8, 0);
        playTone(466.16, 'triangle', 0.8, 140);
        playTone(554.37, 'triangle', 1.2, 280);
      } else if (religion === '불교') {
        playTone(880, 'sine', 0.4, 0);
        playTone(880, 'sine', 0.6, 120);
        playTone(1760, 'sine', 1.1, 240);
      } else if (religion === '힌두교') {
        playTone(293.66, 'sawtooth', 0.7, 0);
        playTone(440, 'sawtooth', 0.7, 100);
        playTone(587.33, 'sine', 1.2, 200);
      }
    }

    // 내장 고화질 벡터 아트 렌더러 (외부 이미지 깨짐 0%)
    function renderVectorArt(artType) {
      switch (artType) {
        case 'cathedral':
        case 'church':
          return `
            <svg class="art-svg" viewBox="0 0 500 200">
              <rect width="500" height="200" fill="#141c2e"/>
              <path d="M 210 180 L 210 90 L 250 40 L 290 90 L 290 180 Z" fill="#8b5cf6" opacity="0.9"/>
              <path d="M 160 180 L 160 110 L 200 70 L 200 180 Z" fill="#7c3aed"/>
              <path d="M 300 180 L 300 70 L 340 110 L 340 180 Z" fill="#7c3aed"/>
              <line x1="250" y1="20" x2="250" y2="40" stroke="#facc15" stroke-width="4"/>
              <line x1="240" y1="28" x2="260" y2="28" stroke="#facc15" stroke-width="4"/>
              <circle cx="250" cy="110" r="18" fill="#38bdf8" opacity="0.7"/>
              <text x="250" y="192" fill="#c4b5fd" font-size="13" font-weight="bold" text-anchor="middle">🏛️ 바티칸 성 베드로 대성당 / 고딕 성당</text>
            </svg>`;
        case 'christ_statue':
          return `
            <svg class="art-svg" viewBox="0 0 500 200">
              <rect width="500" height="200" fill="#0b1728"/>
              <path d="M 180 200 L 250 110 L 320 200 Z" fill="#1e293b"/>
              <line x1="250" y1="50" x2="250" y2="120" stroke="#f8fafc" stroke-width="12" stroke-linecap="round"/>
              <line x1="160" y1="65" x2="340" y2="65" stroke="#f8fafc" stroke-width="10" stroke-linecap="round"/>
              <circle cx="250" cy="40" r="10" fill="#f8fafc"/>
              <text x="250" y="192" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">🗽 리우데자네이루 코르코바두 구속주 예수상</text>
            </svg>`;
        case 'mosque':
        case 'al_azhar':
          return `
            <svg class="art-svg" viewBox="0 0 500 200">
              <rect width="500" height="200" fill="#0a1a1b"/>
              <path d="M 180 180 L 180 120 Q 250 50 320 120 L 320 180 Z" fill="#10b981" opacity="0.9"/>
              <path d="M 130 180 L 130 70 L 145 50 L 145 180 Z" fill="#059669"/>
              <path d="M 355 180 L 355 50 L 370 70 L 370 180 Z" fill="#059669"/>
              <text x="250" y="55" fill="#facc15" font-size="20" font-weight="bold" text-anchor="middle">☪</text>
              <text x="250" y="192" fill="#6ee7b7" font-size="13" font-weight="bold" text-anchor="middle">🕌 성지 메카 카바 신전 및 웅장한 모스크</text>
            </svg>`;
        case 'buddhist_temple':
          return `
            <svg class="art-svg" viewBox="0 0 500 200">
              <rect width="500" height="200" fill="#1c160c"/>
              <path d="M 180 180 L 190 120 L 310 120 L 320 180 Z" fill="#f59e0b"/>
              <path d="M 150 120 Q 250 80 350 120 L 330 135 L 170 135 Z" fill="#d97706"/>
              <path d="M 170 85 Q 250 50 330 85 L 315 95 L 185 95 Z" fill="#b45309"/>
              <line x1="250" y1="35" x2="250" y2="55" stroke="#facc15" stroke-width="4"/>
              <text x="250" y="192" fill="#fde68a" font-size="13" font-weight="bold" text-anchor="middle">🏯 방콕 에메랄드 사원 및 유서 깊은 불탑</text>
            </svg>`;
        case 'hindu_temple':
          return `
            <svg class="art-svg" viewBox="0 0 500 200">
              <rect width="500" height="200" fill="#201109"/>
              <path d="M 180 180 L 220 50 L 250 35 L 280 50 L 320 180 Z" fill="#ea580c"/>
              <line x1="200" y1="80" x2="300" y2="80" stroke="#fdba74" stroke-width="3"/>
              <line x1="190" y1="120" x2="310" y2="120" stroke="#fdba74" stroke-width="3"/>
              <line x1="185" y1="150" x2="315" y2="150" stroke="#fdba74" stroke-width="3"/>
              <text x="250" y="192" fill="#fdba74" font-size="13" font-weight="bold" text-anchor="middle">🛕 바라나시 갠지스강 석조 힌두 사원</text>
            </svg>`;
        default:
          return `
            <svg class="art-svg" viewBox="0 0 500 200">
              <rect width="500" height="200" fill="#0f1f38"/>
              <circle cx="160" cy="90" r="30" fill="#8b5cf6" opacity="0.8"/>
              <circle cx="220" cy="90" r="30" fill="#10b981" opacity="0.8"/>
              <circle cx="280" cy="90" r="30" fill="#f59e0b" opacity="0.8"/>
              <circle cx="340" cy="90" r="30" fill="#ea580c" opacity="0.8"/>
              <text x="250" y="150" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">🤝 평화와 공존의 다종교 랜드마크</text>
              <text x="250" y="192" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">불교·기독교·이슬람·힌두교의 조화로운 공존</text>
            </svg>`;
      }
    }

    const RELIGION_META = {
      '크리스트교': { id: 'christianity', color: '#8b5cf6' },
      '이슬람교': { id: 'islam', color: '#10b981' },
      '불교': { id: 'buddhism', color: '#f59e0b' },
      '힌두교': { id: 'hinduism', color: '#ea580c' }
    };

    socket.on('connect', () => { myId = socket.id; });

    function joinGame() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const name = document.getElementById('playerName').value;
      socket.emit('joinGame', name);
      document.getElementById('join-form').style.display = 'none';
      document.getElementById('joined-msg').style.display = 'block';
    }

    function startGame() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      socket.emit('startGame');
    }

    socket.on('updateLobby', ({ players, hostId, gameStarted }) => {
      if (gameStarted) return;
      const list = document.getElementById('playerList');
      list.innerHTML = players.map(p => `
        <li class="player-item">
          <span>${p.name} ${p.id === myId ? '<strong>(나)</strong>' : ''}</span>
          ${p.id === hostId ? '<span class="tag-host">방장</span>' : ''}
        </li>
      `).join('');

      const startBtn = document.getElementById('startBtn');
      if (socket.id === hostId && players.length >= 1) {
        startBtn.style.display = 'block';
        startBtn.innerText = players.length === 1 ? '솔로 테스트 시작' : `게임 시작 (${players.length}/4명)`;
      } else {
        startBtn.style.display = 'none';
      }
    });

    socket.on('gameStarted', ({ players, soloMode, mapOwnership, religionStates, currentReligion }) => {
      isSolo = soloMode;
      document.getElementById('lobby-view').style.display = 'none';
      document.getElementById('game-view').style.display = 'grid';

      const me = players.find(p => p.id === socket.id);
      myAssignedReligion = me ? me.religion : null;

      updateBoard(mapOwnership, religionStates);
      setActiveTurn(currentReligion);
      playReligionSound(currentReligion);
    });

    function clickRegion(key) {
      if (!isSolo && myAssignedReligion !== currentActiveReligion) {
        alert(`현재는 [${currentActiveReligion}] 차례입니다!`);
        return;
      }
      selectedRegionKey = key;
      document.getElementById('targetLabel').innerText = `선택: ${key}`;
      document.getElementById('execBtn').disabled = false;

      document.querySelectorAll('.nation-node').forEach(n => n.classList.remove('selected'));
      const activeNode = document.querySelector(`[onclick="clickRegion('${key}')"]`);
      if (activeNode) activeNode.classList.add('selected');
      playTone(587.33, 'sine', 0.15);
    }

    function setMethod(method) {
      selectedMethod = method;
      document.getElementById('btn-direct').classList.toggle('selected', method === '직접전파');
      document.getElementById('btn-long').classList.toggle('selected', method === '장거리');
      playTone(440, 'sine', 0.1);
    }

    function sendAction() {
      if (!selectedRegionKey) return;
      socket.emit('spreadReligion', { regionKey: selectedRegionKey, method: selectedMethod });
      document.getElementById('execBtn').disabled = true;
      selectedRegionKey = null;
      document.getElementById('targetLabel').innerText = '국가를 선택하세요';
      document.querySelectorAll('.nation-node').forEach(n => n.classList.remove('selected'));
    }

    socket.on('turnResultModal', (data) => {
      playReligionSound(data.actorReligion);

      const modal = document.getElementById('result-modal');
      document.getElementById('modalArtBox').innerHTML = renderVectorArt(data.artType);
      document.getElementById('modalTitle').innerText = `${data.actorReligion} ➔ ${data.regionName} 전파`;
      document.getElementById('modalDesc').innerText = data.regionDesc;
      
      const badge = document.getElementById('modalRegionBadge');
      if (data.isHybrid) {
        badge.innerText = '🤝 다종교 종합 화합 국가 (+30)';
        badge.style.background = '#38bdf8';
      } else if (data.isMatched) {
        badge.innerText = '🌟 역사적 주류 일치 (+35)';
        badge.style.background = '#10b981';
      } else {
        badge.innerText = '🌍 특별 문화 교류 (+15)';
        badge.style.background = '#f59e0b';
      }
      badge.style.color = '#060913';

      document.getElementById('modalMethodBadge').innerText = `방식: ${data.method}`;
      document.getElementById('modalEventText').innerText = data.eventText;
      
      const scoreTag = document.getElementById('modalEventScore');
      const sign = data.eventScore >= 0 ? '+' : '';
      scoreTag.innerText = `${sign}${data.eventScore}점`;
      scoreTag.style.color = data.eventScore >= 0 ? '#10b981' : '#ef4444';

      modal.style.display = 'flex';
      updateBoard(data.mapOwnership, data.religionStates);
    });

    function closeModal() {
      document.getElementById('result-modal').style.display = 'none';
    }

    socket.on('nextTurn', ({ currentReligion }) => {
      setActiveTurn(currentReligion);
      playReligionSound(currentReligion);
    });

    function setActiveTurn(religion) {
      currentActiveReligion = religion;

      Object.keys(RELIGION_META).forEach(rName => {
        const meta = RELIGION_META[rName];
        const card = document.getElementById(`card-${meta.id}`);
        const tag = document.getElementById(`turn-tag-${meta.id}`);
        if (card && tag) {
          if (rName === religion) {
            card.classList.add('active-turn');
            tag.style.display = 'inline-block';
          } else {
            card.classList.remove('active-turn');
            tag.style.display = 'none';
          }
        }
      });

      const myTurn = isSolo || (myAssignedReligion === religion);
      document.getElementById('execBtn').disabled = !myTurn || !selectedRegionKey;
    }

    function updateBoard(mapOwnership, religionStates) {
      Object.keys(mapOwnership).forEach(key => {
        const owner = mapOwnership[key];
        const node = document.getElementById(`node-${key}`);
        if (node) {
          node.setAttribute('fill', owner ? RELIGION_META[owner].color : '#111a2e');
          node.setAttribute('stroke', owner ? '#ffffff' : '#334155');
        }
      });

      Object.keys(religionStates).forEach(rName => {
        const state = religionStates[rName];
        const meta = RELIGION_META[rName];
        const scoreElem = document.getElementById(`score-${meta.id}`);
        const regionsElem = document.getElementById(`regions-${meta.id}`);
        if (scoreElem) scoreElem.innerText = `${state.score}점`;
        if (regionsElem) {
          regionsElem.innerHTML = state.regions.map(r => `<span class="region-tag">${r}</span>`).join('');
        }
      });
    }

    socket.on('errorMsg', msg => alert(msg));
  </script>
</body>
</html>
