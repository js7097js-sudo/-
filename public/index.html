<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>세계 4대 종교 전파 시뮬레이션</title>
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://unpkg.com/topojson-client@3"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700;900&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Serif KR', -apple-system, BlinkMacSystemFont, serif; }
    body {
      background: radial-gradient(circle at center, #1b2838 0%, #090d14 100%);
      color: #f4ebd9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    /* 대기실 */
    #lobby-view {
      width: 92%; max-width: 540px;
      background: linear-gradient(180deg, #16202e 0%, #0d131c 100%);
      border: 3px solid #c5a059;
      box-shadow: 0 0 0 2px #090d14, 0 20px 50px rgba(0,0,0,0.9);
      border-radius: 12px; padding: 30px; text-align: center;
    }
    .lobby-title { font-size: 25px; font-weight: 900; color: #f5d78e; margin-bottom: 10px; }
    .lobby-desc { font-size: 13.5px; color: #cbd5e1; margin-bottom: 22px; line-height: 1.6; }
    .input-row { display: flex; gap: 8px; margin-bottom: 15px; }
    input { flex: 1; padding: 12px 14px; border-radius: 6px; border: 1.5px solid #8a6d3b; background: #090d14; color: #f5d78e; font-size: 15px; outline: none; }
    button { cursor: pointer; font-weight: 700; border-radius: 6px; transition: 0.25s; }
    .btn-join { background: linear-gradient(180deg, #d4af37 0%, #9a7b2c 100%); color: #090d14; border: 1px solid #f5d78e; padding: 12px 22px; font-size: 15px; }
    .btn-start { width: 100%; background: linear-gradient(180deg, #10b981 0%, #047857 100%); color: white; border: 1.5px solid #6ee7b7; padding: 14px; font-size: 16px; margin-top: 15px; }

    .player-list { list-style: none; margin: 15px 0; background: rgba(0,0,0,0.45); border: 1px solid #4a3b22; border-radius: 8px; padding: 10px; text-align: left; }
    .player-item { padding: 9px 12px; border-radius: 4px; background: rgba(255,255,255,0.05); margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
    .tag-host { background: #d4af37; color: #090d14; font-size: 11px; padding: 2px 7px; border-radius: 4px; font-weight: 900; }

    /* 인게임 4방면 레이아웃 */
    #game-view {
      display: none; width: 100vw; height: 100vh; max-width: 1640px;
      grid-template-rows: 94px 1fr 100px;
      grid-template-columns: 255px 1fr 255px;
      gap: 10px; padding: 10px;
    }

    @media (max-width: 1024px) {
      #game-view { display: none; height: auto; grid-template-rows: auto; grid-template-columns: 1fr; }
    }

    /* 4방향 엔틱 종교 카드 (서버 프록시를 통한 실제 건축물 배경 완벽 복원) */
    .religion-card {
      border: 2.5px solid #b38f48; border-radius: 8px; padding: 12px 16px;
      display: flex; flex-direction: column; justify-content: space-between;
      position: relative; overflow: hidden;
      box-shadow: inset 0 0 25px rgba(0,0,0,0.85), 0 6px 16px rgba(0,0,0,0.7);
      transition: 0.3s;
    }
    .religion-card::before { content: ''; position: absolute; inset: 3px; border: 1px solid rgba(245, 215, 142, 0.35); border-radius: 5px; pointer-events: none; z-index: 2; }
    .religion-card.active-turn {
      border-color: #fde047 !important;
      box-shadow: 0 0 25px rgba(253, 224, 71, 0.65), inset 0 0 20px rgba(253, 224, 71, 0.25) !important;
      transform: scale(1.015);
    }
