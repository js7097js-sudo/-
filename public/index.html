<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>세계 4대 종교 전파 시뮬레이션</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    body { background: #090d16; color: #f1f5f9; overflow-x: hidden; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }

    /* 로비 창 */
    #lobby-view { width: 90%; max-width: 480px; background: #131c31; border: 1px solid #1e293b; border-radius: 16px; padding: 24px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
    .lobby-title { font-size: 22px; font-weight: 800; color: #38bdf8; margin-bottom: 8px; }
    .lobby-desc { font-size: 13px; color: #94a3b8; margin-bottom: 20px; line-height: 1.4; }
    .input-row { display: flex; gap: 8px; margin-bottom: 15px; }
    input { flex: 1; padding: 12px 14px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; font-size: 15px; outline: none; }
    button { cursor: pointer; border: none; font-weight: bold; border-radius: 8px; transition: 0.2s; }
    .btn-join { background: #38bdf8; color: #090d16; padding: 12px 20px; font-size: 15px; }
    .btn-start { width: 100%; background: #10b981; color: white; padding: 14px; font-size: 16px; margin-top: 15px; }
    .btn-start:hover { background: #059669; }

    .player-list { list-style: none; margin: 15px 0; background: #090d16; border-radius: 10px; padding: 10px; max-height: 150px; overflow-y: auto; text-align: left; }
    .player-item { padding: 8px 12px; border-radius: 6px; background: #131c31; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
    .tag-host { background: #f59e0b; color: #090d16; font-size: 11px; padding: 2px 6px; border-radius: 4px; font-weight: bold; }

    /* 인게임 테이블 레이아웃 (루미큐브 스타일) */
    #game-view { display: none; width: 100vw; height: 100vh; max-width: 1200px; grid-template-rows: 80px 1fr 140px; grid-template-columns: 240px 1fr 240px; gap: 10px; padding: 12px; box-sizing: border-box; }
    
    /* 모바일 반응형 시 레이아웃 축소 */
    @media (max-width: 900px) {
      #game-view { display: none; height: auto; min-height: 100vh; grid-template-rows: auto auto auto auto; grid-template-columns: 1fr; }
    }

    /* 종교 패널 (4개 모서리/방향) */
    .religion-card { background: #131c31; border: 2px solid #334155; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; justify-content: space-between; position: relative; transition: 0.3s; }
    .religion-card.active-turn { border-color: #facc15; box-shadow: 0 0 15px rgba(250, 204, 21, 0.4); transform: scale(1.02); }
    .religion-name { font-size: 16px; font-weight: 800; display: flex; align-items: center; gap: 6px; }
    .religion-score { font-size: 22px; font-weight: 900; margin-top: 4px; }
    .region-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
    .region-tag { font-size: 11px; padding: 2px 6px; border-radius: 4px; background: #1e293b; color: #cbd5e1; }

    /* 위치별 패널 배치 */
    .panel-north { grid-column: 2; grid-row: 1; border-top: 4px solid #3b82f6; }   /* 크리스트교 */
    .panel-west  { grid-column: 1; grid-row: 2; border-left: 4px solid #10b981; }  /* 이슬람교 */
    .panel-east  { grid-column: 3; grid-row: 2; border-right: 4px solid #f59e0b; } /* 불교 */
    .panel-south { grid-column: 2; grid-row: 3; border-bottom: 4px solid #8b5cf6; }/* 힌두교 */

    /* 중앙 인터랙티브 세계 지도 보드판 */
    .board-center { grid-column: 2; grid-row: 2; background: #0c1222; border-radius: 14px; border: 1px solid #1e293b; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; padding: 10px; }
    .map-svg { width: 100%; height: 100%; max-height: 480px; }
    .map-node { cursor: pointer; transition: 0.2s; }
    .map-node:hover { stroke: #ffffff; stroke-width: 3; }
    .map-node.selected { stroke: #facc15; stroke-width: 4; }

    /* 컨트롤 & 로그 하단/사이드 오버레이 */
    .action-panel { position: absolute; bottom: 12px; background: rgba(19, 28, 49, 0.95); backdrop-filter: blur(8px); border: 1px solid #38bdf8; border-radius: 10px; padding: 10px 16px; display: flex; gap: 10px; align-items: center; z-index: 10; }
    .method-btn { background: #1e293b; color: white; padding: 8px 12px; border-radius: 6px; font-size: 12px; border: 1px solid #475569; }
    .method-btn.selected { background: #38bdf8; color: #090d16; font-weight: bold; border-color: #38bdf8; }
    .btn-spread { background: #e11d48; color: white; padding: 8px 16px; font-size: 13px; border-radius: 6px; }
    .btn-spread:disabled { opacity: 0.4; cursor: not-allowed; }

    /* 실시간 돌발 사건 피커 */
    .event-ticker { position: absolute; top: 12px; background: rgba(9, 13, 22, 0.85); padding: 6px 14px; border-radius: 20px; border: 1px solid #334155; font-size: 12px; color: #facc15; font-weight: 600; }
  </style>
</head>
<body>

  <!-- 1. 입장 대기실 (1인 솔로 테스트 & 4인 멀티 겸용) -->
  <div id="lobby-view">
    <div class="lobby-title">🌍 세계 종교 전파 시뮬레이션</div>
    <div class="lobby-desc">
      4대 종교의 실제 발상지와 역사적 전파 경로를 탐험하는 턴제 보드게임입니다.<br>
      <span style="color:#38bdf8;">(혼자 테스트 시 바로 '게임 시작'을 눌러 4개 종교를 모두 조작할 수 있습니다)</span>
    </div>

    <div id="join-form" class="input-row">
      <input id="playerName" placeholder="참가자 이름 입력" maxlength="8" />
      <button class="btn-join" onclick="joinGame()">입장</button>
    </div>
    <div id="joined-msg" style="display:none; color:#10b981; font-weight:bold; margin-bottom:10px;">
      ✅ 입장 완료!
    </div>

    <ul id="playerList" class="player-list"></ul>
    <button id="startBtn" class="btn-start" onclick="startGame()" style="display:none;">게임 시작</button>
  </div>

  <!-- 2. 인게임 뷰 (루미큐브 4방향 모서리 + 중앙 지도) -->
  <div id="game-view">
    
    <!-- 북쪽: 크리스트교 -->
    <div id="card-christianity" class="religion-card panel-north">
      <div class="religion-name" style="color:#3b82f6;">✝️ 크리스트교 <span id="turn-tag-christianity" style="display:none; font-size:11px; background:#facc15; color:black; padding:1px 5px; border-radius:3px;">턴</span></div>
      <div id="score-christianity" class="religion-score">50점</div>
      <div id="regions-christianity" class="region-tags"><span class="region-tag">남유럽</span></div>
    </div>

    <!-- 서쪽: 이슬람교 -->
    <div id="card-islam" class="religion-card panel-west">
      <div class="religion-name" style="color:#10b981;">☪️ 이슬람교 <span id="turn-tag-islam" style="display:none; font-size:11px; background:#facc15; color:black; padding:1px 5px; border-radius:3px;">턴</span></div>
      <div id="score-islam" class="religion-score">50점</div>
      <div id="regions-islam" class="region-tags"><span class="region-tag">서남아시아</span></div>
    </div>

    <!-- 중앙: 대형 세계 지도 SVG 보드 -->
    <div class="board-center">
      <div id="eventTicker" class="event-ticker">🗺️ 게임이 시작되었습니다. 지도의 지역을 클릭하세요!</div>
      
      <svg class="map-svg" viewBox="0 0 900 500">
        <!-- 바다 배경선 -->
        <rect width="900" height="500" fill="#0c1222" rx="10"/>

        <!-- 연결 무역로 (루트 선) -->
        <g stroke="#1e293b" stroke-width="2" stroke-dasharray="4">
          <line x1="200" y1="180" x2="420" y2="160" /> <!-- 북미 - 서유럽 -->
          <line x1="420" y1="160" x2="450" y2="230" /> <!-- 서유럽 - 남유럽 -->
          <line x1="450" y1="230" x2="560" y2="260" /> <!-- 남유럽 - 서남아시아 -->
          <line x1="560" y1="260" x2="630" y2="290" /> <!-- 서남아시아 - 남아시아 -->
          <line x1="630" y1="290" x2="720" y2="330" /> <!-- 남아시아 - 동남아시아 -->
          <line x1="630" y1="290" x2="730" y2="210" /> <!-- 남아시아 - 동아시아 (실크로드) -->
          <line x1="260" y1="340" x2="450" y2="230" /> <!-- 라틴미 - 남유럽 -->
        </g>

        <!-- 8개 대륙/지역 노드 (실제 발상지 초기 컬러링) -->
        <!-- 북아메리카 -->
        <g class="map-node" onclick="clickRegion('북아메리카')">
          <rect id="node-북아메리카" x="120" y="140" width="120" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
          <text x="180" y="175" fill="white" font-size="13" font-weight="bold" text-anchor="middle">북아메리카</text>
        </g>

        <!-- 라틴아메리카 -->
        <g class="map-node" onclick="clickRegion('라틴아메리카')">
          <rect id="node-라틴아메리카" x="200" y="300" width="120" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
          <text x="260" y="335" fill="white" font-size="13" font-weight="bold" text-anchor="middle">라틴아메리카</text>
        </g>

        <!-- 서유럽 -->
        <g class="map-node" onclick="clickRegion('서유럽')">
          <rect id="node-서유럽" x="380" y="130" width="100" height="55" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
          <text x="430" y="162" fill="white" font-size="13" font-weight="bold" text-anchor="middle">서유럽</text>
        </g>

        <!-- 남유럽 (크리스트교 발상 기점) -->
        <g class="map-node" onclick="clickRegion('남유럽')">
          <rect id="node-남유럽" x="410" y="210" width="100" height="55" rx="8" fill="#3b82f6" stroke="#60a5fa" stroke-width="2"/>
          <text x="460" y="242" fill="white" font-size="13" font-weight="bold" text-anchor="middle">남유럽</text>
        </g>

        <!-- 서남아시아 (이슬람교 발상 기점) -->
        <g class="map-node" onclick="clickRegion('서남아시아')">
          <rect id="node-서남아시아" x="520" y="240" width="110" height="55" rx="8" fill="#10b981" stroke="#34d399" stroke-width="2"/>
          <text x="575" y="272" fill="white" font-size="13" font-weight="bold" text-anchor="middle">서남아시아</text>
        </g>

        <!-- 남아시아 (힌두교 발상 기점) -->
        <g class="map-node" onclick="clickRegion('남아시아')">
          <rect id="node-남아시아" x="580" y="320" width="110" height="55" rx="8" fill="#8b5cf6" stroke="#a78bfa" stroke-width="2"/>
          <text x="635" y="352" fill="white" font-size="13" font-weight="bold" text-anchor="middle">남아시아</text>
        </g>

        <!-- 동아시아 -->
        <g class="map-node" onclick="clickRegion('동아시아')">
          <rect id="node-동아시아" x="700" y="180" width="110" height="55" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
          <text x="755" y="212" fill="white" font-size="13" font-weight="bold" text-anchor="middle">동아시아</text>
        </g>

        <!-- 동남아시아 (불교 기점) -->
        <g class="map-node" onclick="clickRegion('동남아시아')">
          <rect id="node-동남아시아" x="700" y="300" width="110" height="55" rx="8" fill="#f59e0b" stroke="#fbbf24" stroke-width="2"/>
          <text x="755" y="332" fill="white" font-size="13" font-weight="bold" text-anchor="middle">동남아시아</text>
        </g>
      </svg>

      <!-- 조작 컨트롤 바 -->
      <div class="action-panel">
        <span id="targetLabel" style="font-size:12px; color:#cbd5e1;">지역을 선택하세요</span>
        <button class="method-btn active" id="btn-direct" onclick="setMethod('직접전파')">직접전파(인접로)</button>
        <button class="method-btn" id="btn-long" onclick="setMethod('장거리')">장거리(교역·선교)</button>
        <button id="execBtn" class="btn-spread" onclick="sendAction()" disabled>전파 실행</button>
      </div>
    </div>

    <!-- 동쪽: 불교 -->
    <div id="card-buddhism" class="religion-card panel-east">
      <div class="religion-name" style="color:#f59e0b;">☸️ 불교 <span id="turn-tag-buddhism" style="display:none; font-size:11px; background:#facc15; color:black; padding:1px 5px; border-radius:3px;">턴</span></div>
      <div id="score-buddhism" class="religion-score">50점</div>
      <div id="regions-buddhism" class="region-tags"><span class="region-tag">동남아시아</span></div>
    </div>

    <!-- 남쪽: 힌두교 -->
    <div id="card-hinduism" class="religion-card panel-south">
      <div class="religion-name" style="color:#8b5cf6;">🕉️ 힌두교 <span id="turn-tag-hinduism" style="display:none; font-size:11px; background:#facc15; color:black; padding:1px 5px; border-radius:3px;">턴</span></div>
      <div id="score-hinduism" class="religion-score">50점</div>
      <div id="regions-hinduism" class="region-tags"><span class="region-tag">남아시아</span></div>
    </div>

  </div>

  <script>
    const socket = io();
    let myId = null;
    let selectedRegion = null;
    let selectedMethod = '직접전파';
    let currentActiveReligion = '크리스트교';
    let myAssignedReligion = null;
    let isSolo = false;

    const RELIGION_META = {
      '크리스트교': { id: 'christianity', color: '#3b82f6' },
      '이슬람교': { id: 'islam', color: '#10b981' },
      '불교': { id: 'buddhism', color: '#f59e0b' },
      '힌두교': { id: 'hinduism', color: '#8b5cf6' }
    };

    socket.on('connect', () => { myId = socket.id; });

    function joinGame() {
      const name = document.getElementById('playerName').value;
      socket.emit('joinGame', name);
      document.getElementById('join-form').style.display = 'none';
      document.getElementById('joined-msg').style.display = 'block';
    }

    function startGame() {
      socket.emit('startGame');
    }

    socket.on('updateLobby', ({ players, hostId, gameStarted }) => {
      if (gameStarted) return;

      const list = document.getElementById('playerList');
      list.innerHTML = players.map(p => {
        const isHost = (p.id === hostId);
        return `
          <li class="player-item">
            <span>${p.name} ${p.id === myId ? '<strong>(나)</strong>' : ''}</span>
            ${isHost ? '<span class="tag-host">방장</span>' : ''}
          </li>
        `;
      }).join('');

      // 방장이면 인원수 상관없이 바로 게임 시작 가능 (1명 솔로 테스트 지원)
      const startBtn = document.getElementById('startBtn');
      if (socket.id === hostId && players.length >= 1) {
        startBtn.style.display = 'block';
        startBtn.innerText = players.length === 1 ? '솔로 테스트 모드로 시작' : `게임 시작 (${players.length}/4명)`;
      } else {
        startBtn.style.display = 'none';
      }
    });

    socket.on('gameStarted', ({ players, soloMode, mapOwnership, religionStates, currentReligion }) => {
      isSolo = soloMode;
      document.getElementById('lobby-view').style.display = 'none';
      document.getElementById('game-view').style.display = 'grid';

      const me = players.find(p => p.id === socket.id);
      myAssignedReligion = me ? me.religion : null;

      updateBoard(mapOwnership, religionStates);
      setActiveTurn(currentReligion);
    });

    function clickRegion(regionName) {
      // 본인 차례가 아니면 클릭 불가 (솔로 모드 제외)
      if (!isSolo && myAssignedReligion !== currentActiveReligion) {
        alert(`지금은 [${currentActiveReligion}]의 턴입니다!`);
        return;
      }

      selectedRegion = regionName;
      document.getElementById('targetLabel').innerText = `선택: ${regionName}`;
      document.getElementById('execBtn').disabled = false;

      // 노드 하이라이트
      document.querySelectorAll('.map-node rect').forEach(r => r.classList.remove('selected'));
      const activeRect = document.getElementById(`node-${regionName}`);
      if (activeRect) activeRect.classList.add('selected');
    }

    function setMethod(method) {
      selectedMethod = method;
      document.getElementById('btn-direct').classList.toggle('selected', method === '직접전파');
      document.getElementById('btn-long').classList.toggle('selected', method === '장거리');
    }

    function sendAction() {
      if (!selectedRegion) return;
      socket.emit('spreadReligion', { regionName: selectedRegion, method: selectedMethod });
      document.getElementById('execBtn').disabled = true;
      selectedRegion = null;
      document.getElementById('targetLabel').innerText = '지역을 선택하세요';
      document.querySelectorAll('.map-node rect').forEach(r => r.classList.remove('selected'));
    }

    socket.on('turnResult', (data) => {
      // 상단 사건 티커 갱신
      const ticker = document.getElementById('eventTicker');
      const sign = data.eventScore >= 0 ? '+' : '';
      ticker.innerHTML = `⚡ [${data.actorReligion}] ${data.regionName} 전파 (${data.method}) | 사건: ${data.eventText} (${sign}${data.eventScore}점) ➔ <strong>+${data.totalGain}점</strong>`;

      updateBoard(data.mapOwnership, data.religionStates);
    });

    socket.on('nextTurn', ({ currentReligion }) => {
      setActiveTurn(currentReligion);
    });

    function setActiveTurn(religion) {
      currentActiveReligion = religion;

      // 4개 패널 턴 하이라이트 갱신
      Object.keys(RELIGION_META).forEach(rName => {
        const meta = RELIGION_META[rName];
        const card = document.getElementById(`card-${meta.id}`);
        const tag = document.getElementById(`turn-tag-${meta.id}`);
        if (card && tag) {
          if (rName === religion) {
            card.classList.add('active-turn');
            tag.style.display = 'inline-block';
          } else {
            card.classList.remove('active-turn');
            tag.style.display = 'none';
          }
        }
      });

      // 현재 내 조작 차례인지 여부
      const myTurn = isSolo || (myAssignedReligion === religion);
      document.getElementById('execBtn').disabled = !myTurn || !selectedRegion;
    }

    function updateBoard(mapOwnership, religionStates) {
      // 1. 지도 색칠 동기화
      Object.keys(mapOwnership).forEach(region => {
        const owner = mapOwnership[region];
        const rect = document.getElementById(`node-${region}`);
        if (rect) {
          rect.setAttribute('fill', owner ? RELIGION_META[owner].color : '#1e293b');
        }
      });

      // 2. 패널 점수 및 보유 영토 동기화
      Object.keys(religionStates).forEach(rName => {
        const state = religionStates[rName];
        const meta = RELIGION_META[rName];
        const scoreElem = document.getElementById(`score-${meta.id}`);
        const regionsElem = document.getElementById(`regions-${meta.id}`);
        if (scoreElem) scoreElem.innerText = `${state.score}점`;
        if (regionsElem) {
          regionsElem.innerHTML = state.regions.map(r => `<span class="region-tag">${r}</span>`).join('');
        }
      });
    }

    socket.on('errorMsg', (msg) => alert(msg));
  </script>
</body>
</html>
